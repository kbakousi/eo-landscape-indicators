[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eolandscape"
version = "0.1.1"
description = "Earth-observation landscape indicators (spectral indices, climate anomalies, trends, burned area, land-cover diversity and fragmentation) from open data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aikaterini Bakousi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]
keywords = ["earth observation", "remote sensing", "sentinel-2", "landsat", "modis", "drought", "landscape ecology", "fragmentation", "trend analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
xarray = ["xarray>=2023.1"]
stac = ["pystac-client>=0.7", "odc-stac>=0.3", "planetary-computer>=1.0", "xarray>=2023.1"]
test = ["pytest>=7", "xarray>=2023.1", "dask[array]>=2023.1", "nbclient>=0.7", "nbformat>=5.7", "ipykernel>=6", "matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4", "xarray>=2023.1", "dask[array]>=2023.1", "nbclient>=0.7", "nbformat>=5.7", "ipykernel>=6", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY", "UP"]
